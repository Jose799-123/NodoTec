<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
  <defs>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075985"/>
      <stop offset="1" stop-color="#0c1e3a"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular -->
  <circle cx="270" cy="215" r="185" fill="#38bdf8" opacity=".14"/>
  <circle cx="270" cy="215" r="130" fill="#38bdf8" opacity=".12"/>
  <!-- Red de nodos -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity=".8">
    <line x1="60" y1="90" x2="120" y2="45"/>
    <line x1="120" y1="45" x2="175" y2="75"/>
    <line x1="60" y1="90" x2="92" y2="140"/>
  </g>
  <g fill="#0284c7">
    <circle cx="60" cy="90" r="8"/>
    <circle cx="120" cy="45" r="7"/>
    <circle cx="175" cy="75" r="6"/>
    <circle cx="92" cy="140" r="6"/>
  </g>
  <!-- Pantalla del portátil -->
  <rect x="120" y="100" width="290" height="190" rx="14" fill="#0f172a"/>
  <rect x="133" y="113" width="264" height="164" rx="6" fill="url(#pantalla)"/>
  <rect x="150" y="132" width="90" height="10" rx="5" fill="#38bdf8"/>
  <rect x="150" y="153" width="150" height="8" rx="4" fill="#7dd3fc" opacity=".55"/>
  <rect x="150" y="169" width="115" height="8" rx="4" fill="#7dd3fc" opacity=".55"/>
  <rect x="150" y="185" width="175" height="8" rx="4" fill="#7dd3fc" opacity=".55"/>
  <!-- Barra de progreso de diagnóstico -->
  <rect x="150" y="224" width="228" height="14" rx="7" fill="#ffffff" opacity=".15"/>
  <rect x="150" y="224" width="182" height="14" rx="7" fill="#22c55e"/>
  <rect x="150" y="250" width="60" height="8" rx="4" fill="#f97316"/>
  <!-- Base del portátil -->
  <path d="M95 290 H435 L418 312 Q414 318 406 318 H124 Q116 318 112 312 Z" fill="#94a3b8"/>
  <rect x="235" y="290" width="60" height="7" rx="3.5" fill="#64748b"/>
  <!-- Escudo de seguridad -->
  <g transform="translate(392 62)">
    <path d="M40 0 L76 14 V44 C76 68 60 86 40 94 C20 86 4 68 4 44 V14 Z" fill="#16a34a"/>
    <path d="M24 46 L36 58 L58 34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Engranaje -->
  <g transform="translate(108 335)">
    <circle r="30" fill="none" stroke="#f97316" stroke-width="14" stroke-dasharray="8.5 7.21"/>
    <circle r="23" fill="#f97316"/>
    <circle r="9" fill="#fff"/>
  </g>
  <!-- Chip -->
  <g transform="translate(418 300)">
    <g stroke="#0284c7" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="-6" x2="18" y2="4"/><line x1="32" y1="-6" x2="32" y2="4"/><line x1="46" y1="-6" x2="46" y2="4"/>
      <line x1="18" y1="60" x2="18" y2="70"/><line x1="32" y1="60" x2="32" y2="70"/><line x1="46" y1="60" x2="46" y2="70"/>
    </g>
    <rect width="64" height="64" rx="10" fill="#0284c7"/>
    <rect x="17" y="17" width="30" height="30" rx="4" fill="#e0f2fe"/>
  </g>
